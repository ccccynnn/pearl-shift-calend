<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c5a6c8"><link rel="manifest" href="manifest.json"><title>珍珠輪班行事曆</title><style>
:root{--gold:#c3a16b;--plum:#66506b;--pink:#f4e6ed;--cream:#fffaf3}*{box-sizing:border-box}body{margin:0;color:var(--plum);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f6e9ee url('rococo_garden_wallpaper.jpg') center/cover fixed}body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,#fff8f0b8,#f5e5f2a8);pointer-events:none}header,.app,nav{position:relative;z-index:1}.top{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 18px) 18px 16px;background:#fffaf2e8;border-bottom:1px solid var(--gold);backdrop-filter:blur(8px)}.logo{width:66px;height:66px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(140deg,#fff,#e9d7ef);border:2px solid #d9bf8e;box-shadow:0 0 0 3px #fff8ef;font-size:30px}.top h1{font-size:23px;margin:0;letter-spacing:1px}.top small{letter-spacing:2px;color:#9a829f}.app{max-width:760px;margin:auto;padding:15px 12px 105px}.card{position:relative;border:1.5px solid var(--gold);border-radius:26px;padding:17px 13px;margin:12px 0 20px;background:linear-gradient(145deg,#fffdf7ed,#fff7f8e8 60%,#f8effbe8);box-shadow:0 7px 22px #59445b26,inset 0 0 0 3px #fffaf3;overflow:hidden;backdrop-filter:blur(5px)}.card:before{content:'❦';position:absolute;top:5px;left:10px;color:#c4a16b;font-size:23px}.card:after{content:'✧  •  ❦';position:absolute;right:10px;top:8px;color:#c4a16b;letter-spacing:4px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 18px}.monthbar strong{font-size:25px;white-space:nowrap}.button{border:1px solid #d8c094;border-radius:18px;background:linear-gradient(#fffdf8,#f7eaf2);color:var(--plum);font-size:20px;padding:10px 14px;box-shadow:0 2px 5px #9e7b6922}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays div{text-align:center;padding:8px 0;color:#a184a3;font-weight:700}.grid{border:1px solid #e4d4dc;border-radius:10px;overflow:hidden}.day{min-height:76px;padding:7px 3px;border-right:1px solid #eadde2;border-bottom:1px solid #eadde2;background:#fffdf9c9;cursor:pointer;min-width:0}.day .n{font-weight:700;font-size:15px;margin-bottom:9px}.day.dim .n{color:#c4b4c7}.day.selected{outline:2px solid #b69ac2;outline-offset:-3px;background:#f5eafaed}.day.today .n{display:inline-grid;place-items:center;background:#b394bd;color:white;border-radius:50%;width:28px;height:28px;margin-top:-4px}.pill{display:block;border-radius:20px;text-align:center;font-size:12px;padding:6px 1px;font-weight:700;white-space:nowrap}.off{background:#dcf4e8;color:#268265}.night{background:#e7e3ff;color:#6565b7}.daywork{background:#fff0c9;color:#9b6b10}.legend{display:flex;gap:14px;padding-top:13px;color:#9a829f}.legend span:before{content:'●';margin-right:5px}.moodrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}.mood{border:1px solid #e1cfdd;border-radius:15px;padding:9px 1px;background:#fffaf4;text-align:center;font-size:22px;cursor:pointer}.mood small{display:block;font-size:10px;color:#9b859e;margin-top:4px}.mood.active{background:#ead8f1;border-color:#b79ac2;box-shadow:0 0 0 2px #fff}.field{width:100%;min-height:90px;border:1px solid #dec9d8;border-radius:18px;background:#fffdf9d9;padding:12px;font:inherit;color:var(--plum);margin:10px 0}.primary{width:100%;border:0;border-radius:18px;background:linear-gradient(100deg,#b89ac2,#d9b6ce);color:white;font-weight:700;padding:14px;font-size:16px}.info{line-height:1.8}.muted{color:#a18ba4;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:12px 4px calc(env(safe-area-inset-bottom) + 10px);background:#fffaf2ed;border-top:1px solid #d9bf91;backdrop-filter:blur(10px)}nav button{border:0;background:none;color:#a18aa6;font-size:12px;padding:4px}nav b{display:block;font-size:22px;margin-bottom:3px}nav button.active{color:#85658e}@media(min-width:520px){.day{min-height:94px;padding:10px}.day .n{font-size:17px}.pill{font-size:13px}.app{padding-top:25px}}
</style></head><body><header class="top"><div class="logo">♕</div><div><h1>珍珠輪班行事曆</h1><small>PEARL SHIFT CALENDAR</small></div></header><main class="app"><section class="card"><div class="monthbar"><button class="button" id="prev">‹</button><strong id="month"></strong><button class="button" id="next">›</button><button class="button" id="today">今天</button></div><div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="grid" id="grid"></div><div class="legend"><span style="color:#d5a53e">日班</span><span style="color:#817bdd">夜班</span><span style="color:#4eaa8b">休假</span></div></section><section class="card"><h2>當日排班</h2><div class="info" id="shift"></div><div class="muted" id="countdown"></div></section><section class="card"><h2>今日心情・每日表情標記</h2><div class="moodrow" id="moods"></div><p class="muted">點選表情即可標記所選日期；再次點選同一表情可取消。</p></section><section class="card"><h2>當日備註</h2><textarea class="field" id="note" placeholder="例如：加班、約會、提醒事項…"></textarea><button class="primary" id="save">儲存備註</button></section><section class="card"><h2>輪班規則</h2><p class="info">夜班：19:30～07:30<br>日班：07:30～19:30<br>日班固定 8 週，夜班固定 8 週。排班日期請以月曆顯示與實際班表核對。</p></section></main><nav><button class="active"><b>▦</b>行事曆</button><button onclick="document.querySelectorAll('.card')[4].scrollIntoView({behavior:'smooth'})"><b>♧</b>規則</button><button onclick="document.querySelectorAll('.card')[1].scrollIntoView({behavior:'smooth'})"><b>↻</b>未來排程</button><button onclick="alert('已記錄的心情與備註保存在此裝置。')"><b>◷</b>統計</button></nav><script>
const moods=[['😍','超開心'],['😊','開心'],['😌','平靜'],['😐','普通'],['🥱','疲倦'],['😣','壓力'],['😭','低落']];let view=new Date(2026,9,1),selected='2026-10-10';const key=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function shift(d){let s=key(d);if(s>='2026-10-07'&&s<='2026-10-10')return'夜班';if(s>='2026-10-14'&&s<='2026-10-16')return'夜班';if(s>='2026-10-21'&&s<='2026-10-24')return'日班';if(s>='2026-10-29'&&s<='2026-11-07')return'日班';if(s>='2026-11-11'&&s<='2026-11-14')return'日班';return'休假'}function render(){document.getElementById('month').textContent=`${view.getFullYear()} 年 ${view.getMonth()+1} 月`;let first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let grid=document.getElementById('grid');grid.innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let s=key(d),sh=shift(d),el=document.createElement('div');el.className='day'+(d.getMonth()!==view.getMonth()?' dim':'')+(s===selected?' selected':'')+(s===key(new Date())?' today':'');let cls=sh==='夜班'?'night':sh==='日班'?'daywork':'off';el.innerHTML=`<div class="n">${d.getDate()}</div><span class="pill ${cls}">${sh}</span>`;el.onclick=()=>{selected=s;render();loadDay()};grid.append(el)}loadDay()}function loadDay(){let d=new Date(selected+'T12:00:00'),sh=shift(d);document.getElementById('shift').innerHTML=`<b>${sh}</b><br>${selected}<br>${sh==='夜班'?'19:30～07:30':sh==='日班'?'07:30～19:30':'好好休息，享受今天 ♡'}`;let next=new Date(d);while(shift(next)==='休假')next.setDate(next.getDate()+1);let days=Math.max(0,Math.ceil((next-d)/86400000));document.getElementById('countdown').textContent=sh==='休假'?`距離下次上班約 ${days} 天`:'祝你今天順利 ♡';document.getElementById('note').value=localStorage['note-'+selected]||'';document.querySelectorAll('.mood').forEach((e,i)=>e.classList.toggle('active',localStorage['mood-'+selected]===String(i)))}document.getElementById('moods').innerHTML=moods.map((m,i)=>`<button class="mood" data-i="${i}">${m[0]}<small>${m[1]}</small></button>`).join('');document.querySelectorAll('.mood').forEach(e=>e.onclick=()=>{let i=e.dataset.i,k='mood-'+selected;if(localStorage[k]===i)delete localStorage[k];else localStorage[k]=i;loadDay()});document.getElementById('save').onclick=()=>{localStorage['note-'+selected]=document.getElementById('note').value;alert('備註已儲存 ♡')};document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};document.getElementById('today').onclick=()=>{let n=new Date();selected=key(n);view=new Date(n.getFullYear(),n.getMonth(),1);render()};render();loadDay();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
